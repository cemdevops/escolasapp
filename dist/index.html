<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscolasApp Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #app {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        #data-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .data-box {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .data-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }
        .data-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .data-box .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .data-box .status-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
        }
        .data-box .status-icon.error {
            background: #dc3545;
        }
        .data-box .count {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .data-box .count-label {
            font-size: 12px;
            color: #999;
        }
        .error {
            color: #c33;
            padding: 20px;
            background: #fadbd8;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>
            🎓 EscolasApp
            <span class="status-badge online">✓ Online</span>
        </h1>
        <p class="subtitle">API Dashboard & Status Monitor</p>
        <div id="data-container" class="loading">
            <p>Carregando dados...</p>
        </div>
        <div class="footer">
            <span>API Version: 1.0 | Database: MongoDB 5.0</span>
            <span id="timestamp"></span>
        </div>
    </div>

    <script>
        async function loadData() {
            const container = document.getElementById("data-container");
            const timestamp = document.getElementById("timestamp");
            timestamp.textContent = new Date().toLocaleTimeString();

            try {
                const endpoints = [
                    { url: "/school", name: "Schools" },
                    { url: "/weightingarea", name: "Weighting Areas" },
                    { url: "/ap-secvariable", name: "AP Sec Variables" },
                    { url: "/br-sp-rmsp-secvariable", name: "BR/SP Sec Variables" }
                ];

                let allLoaded = false;
                const boxes = [];

                for (const endpoint of endpoints) {
                    try {
                        const resp = await fetch(endpoint.url);
                        const data = await resp.json();

                        boxes.push({
                            name: endpoint.name,
                            status: resp.status === 200 ? '✓' : '✗',
                            count: Array.isArray(data) ? data.length : 0,
                            error: null
                        });
                    } catch (e) {
                        boxes.push({
                            name: endpoint.name,
                            status: '✗',
                            count: 0,
                            error: e.message
                        });
                    }
                }

                container.innerHTML = boxes.map(box => `
                    <div class="data-box">
                        <h3>${box.name}</h3>
                        <div class="status">
                            <div class="status-icon${box.error ? ' error' : ''}"></div>
                            <span style="color: ${box.error ? '#dc3545' : '#28a745'}">${box.status}</span>
                        </div>
                        ${box.error ? 
                            `<p style="color: #c33; font-size: 12px">${box.error}</p>` :
                            `<div class="count">${box.count}</div><div class="count-label">records</div>`
                        }
                    </div>
                `).join('');

                timestamp.textContent = new Date().toLocaleTimeString();
            } catch (e) {
                container.innerHTML = `<div class="error">⚠️ Error loading data: ${e.message}</div>`;
            }
        }

        window.addEventListener("load", loadData);
        // Reload every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>

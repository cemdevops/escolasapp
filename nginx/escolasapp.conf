# Nginx configuration for EscolasApp - Reverse Proxy & Load Balancing
# Place in /etc/nginx/sites-available/escolasapp (Linux)
# Then: ln -s /etc/nginx/sites-available/escolasapp /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

upstream escolasapp_backend {
    # Health check configuration
    #keepalive 32;
    
    # Round-robin load balancing between app instances
    server app-prod:3002 max_fails=3 fail_timeout=30s;
    
    # Uncomment for multiple instances:
    # server localhost:3003 max_fails=3 fail_timeout=30s;
    # server localhost:3004 max_fails=3 fail_timeout=30s;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name escolasapp.example.com www.escolasapp.example.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name escolasapp.example.com www.escolasapp.example.com;

    # SSL/TLS Configuration
    ssl_certificate /etc/letsencrypt/live/escolasapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/escolasapp.example.com/privkey.pem;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:" always;

    # Logging
    access_log /var/log/nginx/escolasapp-access.log combined;
    error_log /var/log/nginx/escolasapp-error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Client upload limit
    client_max_body_size 100M;

    # Root location
    location / {
        proxy_pass http://escolasapp_backend;
        proxy_http_version 1.1;
        
        # Headers for upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Keep-alive
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API endpoints - with caching headers
    location /api/ {
        proxy_pass http://escolasapp_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache control for API responses (adjust as needed)
        add_header Cache-Control "public, max-age=3600" always;
        
        proxy_cache_valid 200 1h;
        proxy_cache_bypass $http_cache_control;
    }

    # Static content - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://escolasapp_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://escolasapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

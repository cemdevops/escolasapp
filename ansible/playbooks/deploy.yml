---
# Application Deployment Playbook
# Deploy to staging or production environments
# Usage: ansible-playbook -i ansible/inventories/staging/hosts ansible/playbooks/deploy.yml --vault-password-file ~/.ansible-vault-pass

- name: Deploy EscolasApp Application
  hosts: "{{ target_hosts | default(omit) }}"
  become: yes
  gather_facts: yes
  
  pre_tasks:
    - name: Validate target environment
      assert:
        that:
          - app_environment in ['staging', 'production']
        fail_msg: "Invalid environment. Use 'staging' or 'production'."
      tags:
        - always
        - validate

    - name: Display deployment information
      debug:
        msg: |
          Deploying {{ app_name }} to {{ app_environment }}
          
          Repository: {{ app_repo_url }}
          Branch: {{ app_repo_branch }}
          Docker Registry: {{ docker_registry_url }}
          Database: {{ db_host }}:{{ db_port }}/{{ db_name }}
      tags:
        - always
        - info

  roles:
    - role: docker_setup
      tags:
        - docker
        - docker_setup

    - role: app_setup
      tags:
        - app
        - app_setup

  post_tasks:
    - name: Verify deployment status
      shell: |
        cd {{ app_repo_dest }} && docker-compose ps
      register: deployment_status
      changed_when: false
      tags:
        - verify

    - name: Display deployment status
      debug:
        msg: "{{ deployment_status.stdout }}"
      tags:
        - verify

    - name: Wait for application health check
      uri:
        url: "http://{{ ansible_host | default('localhost') }}:{{ app_port }}"
        status_code: 200
        method: GET
      register: health_check
      until: health_check.status == 200
      retries: 6
      delay: 10
      ignore_errors: yes
      tags:
        - health

    - name: Deployment success message
      debug:
        msg: |
          ========================================
          Deployment Complete!
          ========================================
          
          Environment: {{ app_environment }}
          Application: http://{{ ansible_host | default('localhost') }}:{{ app_port }}
          Database: {{ db_host }}:{{ db_port }}/{{ db_name }}
          
          Next steps:
          1. Verify application is running: docker-compose ps
          2. Check logs: docker-compose logs -f app
          3. Test endpoint: curl http://localhost:{{ app_port }}/school
          
          ========================================
      tags:
        - info

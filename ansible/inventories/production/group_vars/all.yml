---
# Production Environment Variables
# Critical production environment - HIGH SECURITY
# SENSITIVE VALUES: Encrypted with ansible-vault - DO NOT COMMIT UNENCRYPTED

# Application Environment
app_environment: production
app_name: escolasapp
app_port: 3002
app_repo_url: https://github.com/cemdevops/escolasapp.git
app_repo_branch: master
app_repo_dest: /opt/escolasapp

# Docker Configuration
docker_registry_url: ghcr.io/cemdevops/escolasapp
docker_registry_username: "{{ vault_docker_registry_username }}"
docker_registry_token: "{{ vault_docker_registry_token }}"

# Database Configuration
db_host: "{{ vault_db_host_prod }}"
db_port: 27017
db_name: escolasapp_prod
db_user: "{{ vault_db_user_prod }}"
db_password: "{{ vault_db_password_prod }}"
db_url: "mongodb://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}"

# MongoDB Docker Image
mongo_image: mongo:3.6
mongo_root_username: "{{ vault_db_user_prod }}"
mongo_root_password: "{{ vault_db_password_prod }}"

# Node.js Configuration
nodejs_version: 12
npm_version: 6

# Logging
log_level: warn

# Google Analytics
google_analytics_code: UA-122157047-1

# Environment-specific settings
docker_compose_file: docker-compose.yml
docker_compose_override_file: docker-compose.prod.yml

# Deployment settings
deploy_user: ubuntu
docker_service_name: docker
app_container_name: escolasapp_app
mongodb_container_name: escolasapp_mongodb

# Production-specific security settings
enable_firewall: true
enable_fail2ban: true
backup_retention_days: 30

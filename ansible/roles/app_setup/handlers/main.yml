---
# Application Setup Role - Handlers

- name: Restart app containers
  docker_compose:
    project_src: "{{ app_repo_dest }}"
    restarted: yes
  listen: Restart app containers
  when: ansible_connection == "local"

- name: Restart app containers (remote)
  shell: |
    cd {{ app_repo_dest }} && docker-compose restart app
  listen: Restart app containers
  when: ansible_connection != "local"
